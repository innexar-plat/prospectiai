services:
  # ── Web (produção): nginx serve SPA + /admin/ + proxy /api/* → backend:4000 (porta interna 80) ──
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile.prod
      args:
        - NEXT_PUBLIC_MERCADOPAGO_PUBLIC_KEY=${NEXT_PUBLIC_MERCADOPAGO_PUBLIC_KEY}
        - VITE_MAINTENANCE_MODE=${VITE_MAINTENANCE_MODE:-}
        - VITE_API_URL=${VITE_API_URL:-}
        - VITE_SUPPORT_EMAIL=${VITE_SUPPORT_EMAIL:-}
        - VITE_SUPPORT_WHATSAPP=${VITE_SUPPORT_WHATSAPP:-}
        - VITE_VAPID_PUBLIC_KEY=${VAPID_PUBLIC_KEY:-}
        - VITE_GA_MEASUREMENT_ID=${VITE_GA_MEASUREMENT_ID:-}
        - VITE_GA_MEASUREMENT_ID_US=${VITE_GA_MEASUREMENT_ID_US:-}
        - VITE_GOOGLE_ADS_CONVERSION_ID=${VITE_GOOGLE_ADS_CONVERSION_ID:-}
        - VITE_GOOGLE_ADS_CONVERSION_LABEL=${VITE_GOOGLE_ADS_CONVERSION_LABEL:-}
        - VITE_GOOGLE_ADS_CONVERSION_ID_US=${VITE_GOOGLE_ADS_CONVERSION_ID_US:-}
        - VITE_GOOGLE_ADS_CONVERSION_LABEL_US=${VITE_GOOGLE_ADS_CONVERSION_LABEL_US:-}
        - VITE_MARKET=${VITE_MARKET:-BR}
    container_name: prospector-frontend
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"
    # Só localhost: tráfego público entra pelo Traefik (80/443)
    ports:
      - "127.0.0.1:5173:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 128m
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - prospector-net
      - fixelo-network
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=fixelo_fixelo-network"
      - "traefik.http.services.prospector-ai-frontend.loadbalancer.server.port=80"
      - "traefik.http.services.prospector-ai-frontend.loadbalancer.passHostHeader=true"
      - "traefik.http.routers.prospector-ai.rule=Host(`precisionia.com.br`)"
      - "traefik.http.routers.prospector-ai.entrypoints=websecure"
      - "traefik.http.routers.prospector-ai.tls.certresolver=cloudflare"
      - "traefik.http.routers.prospector-ai.service=prospector-ai-frontend"
      - "traefik.http.routers.prospector-ai.priority=100"
      - "traefik.http.middlewares.redirect-to-https-prospector.redirectscheme.scheme=https"
      - "traefik.http.middlewares.redirect-to-https-prospector.redirectscheme.permanent=true"
      - "traefik.http.routers.prospector-ai-http.rule=Host(`precisionia.com.br`)"
      - "traefik.http.routers.prospector-ai-http.entrypoints=web"
      - "traefik.http.routers.prospector-ai-http.middlewares=redirect-to-https-prospector"
      - "traefik.http.routers.prospector-ai-http.service=prospector-ai-frontend"
      - "traefik.http.routers.prospector-ai-http.priority=100"
      - "traefik.http.routers.prospector-ai-us.rule=Host(`precisionai.innexar.app`)"
      - "traefik.http.routers.prospector-ai-us.entrypoints=websecure"
      - "traefik.http.routers.prospector-ai-us.tls.certresolver=cloudflare"
      - "traefik.http.routers.prospector-ai-us.service=prospector-ai-frontend"
      - "traefik.http.routers.prospector-ai-us.priority=100"
      - "traefik.http.routers.prospector-ai-us-http.rule=Host(`precisionai.innexar.app`)"
      - "traefik.http.routers.prospector-ai-us-http.entrypoints=web"
      - "traefik.http.routers.prospector-ai-us-http.middlewares=redirect-to-https-prospector"
      - "traefik.http.routers.prospector-ai-us-http.service=prospector-ai-frontend"
      - "traefik.http.routers.prospector-ai-us-http.priority=100"
      - "traefik.http.middlewares.redirect-busca-to-prospectorai.redirectregex.regex=^https?:\\/\\/busca\\.innexar\\.com\\.br(.*)"
      - "traefik.http.middlewares.redirect-busca-to-prospectorai.redirectregex.replacement=https://precisionia.com.br$${1}"
      - "traefik.http.middlewares.redirect-busca-to-prospectorai.redirectregex.permanent=true"
      - "traefik.http.routers.prospector-ai-busca.rule=Host(`busca.innexar.com.br`)"
      - "traefik.http.routers.prospector-ai-busca.entrypoints=websecure"
      - "traefik.http.routers.prospector-ai-busca.tls.certresolver=cloudflare"
      - "traefik.http.routers.prospector-ai-busca.service=prospector-ai-frontend"
      - "traefik.http.routers.prospector-ai-busca.middlewares=redirect-busca-to-prospectorai"
      - "traefik.http.routers.prospector-ai-busca-http.rule=Host(`busca.innexar.com.br`)"
      - "traefik.http.routers.prospector-ai-busca-http.entrypoints=web"
      - "traefik.http.routers.prospector-ai-busca-http.service=prospector-ai-frontend"
      - "traefik.http.routers.prospector-ai-busca-http.middlewares=redirect-busca-to-prospectorai"

  # ── Manutenção: página 503 no Traefik (ativar com --profile maintenance) ─────
  maintenance:
    build:
      context: ./docker/maintenance
      dockerfile: Dockerfile
    container_name: prospector-maintenance
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    profiles:
      - maintenance
    restart: unless-stopped
    networks:
      - fixelo-network
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=fixelo_fixelo-network"
      - "traefik.http.services.prospector-ai-maintenance.loadbalancer.server.port=80"
      # HTTPS — prioridade maior que frontend (100): quando o serviço sobe, captura todo o tráfego
      - "traefik.http.routers.prospector-ai-maintenance.rule=Host(`precisionia.com.br`)"
      - "traefik.http.routers.prospector-ai-maintenance.entrypoints=websecure"
      - "traefik.http.routers.prospector-ai-maintenance.tls.certresolver=cloudflare"
      - "traefik.http.routers.prospector-ai-maintenance.service=prospector-ai-maintenance"
      - "traefik.http.routers.prospector-ai-maintenance.priority=500"
      - "traefik.http.routers.prospector-ai-maintenance-http.rule=Host(`precisionia.com.br`)"
      - "traefik.http.routers.prospector-ai-maintenance-http.entrypoints=web"
      - "traefik.http.routers.prospector-ai-maintenance-http.middlewares=redirect-to-https-prospector"
      - "traefik.http.routers.prospector-ai-maintenance-http.service=prospector-ai-maintenance"
      - "traefik.http.routers.prospector-ai-maintenance-http.priority=500"
      # Domínio antigo busca → mesma página de manutenção
      - "traefik.http.routers.prospector-ai-maintenance-busca.rule=Host(`busca.innexar.com.br`)"
      - "traefik.http.routers.prospector-ai-maintenance-busca.entrypoints=websecure"
      - "traefik.http.routers.prospector-ai-maintenance-busca.tls.certresolver=cloudflare"
      - "traefik.http.routers.prospector-ai-maintenance-busca.service=prospector-ai-maintenance"
      - "traefik.http.routers.prospector-ai-maintenance-busca.priority=500"
      - "traefik.http.routers.prospector-ai-maintenance-busca.middlewares=redirect-busca-to-prospectorai"
      - "traefik.http.routers.prospector-ai-maintenance-busca-http.rule=Host(`busca.innexar.com.br`)"
      - "traefik.http.routers.prospector-ai-maintenance-busca-http.entrypoints=web"
      - "traefik.http.routers.prospector-ai-maintenance-busca-http.service=prospector-ai-maintenance"
      - "traefik.http.routers.prospector-ai-maintenance-busca-http.middlewares=redirect-busca-to-prospectorai"
      - "traefik.http.routers.prospector-ai-maintenance-busca-http.priority=500"
      # US — mesma pagina de manutencao quando o profile maintenance estiver ativo
      - "traefik.http.routers.prospector-ai-maintenance-us.rule=Host(`precisionai.innexar.app`)"
      - "traefik.http.routers.prospector-ai-maintenance-us.entrypoints=websecure"
      - "traefik.http.routers.prospector-ai-maintenance-us.tls.certresolver=cloudflare"
      - "traefik.http.routers.prospector-ai-maintenance-us.service=prospector-ai-maintenance"
      - "traefik.http.routers.prospector-ai-maintenance-us.priority=500"
      - "traefik.http.routers.prospector-ai-maintenance-us-http.rule=Host(`precisionai.innexar.app`)"
      - "traefik.http.routers.prospector-ai-maintenance-us-http.entrypoints=web"
      - "traefik.http.routers.prospector-ai-maintenance-us-http.middlewares=redirect-to-https-prospector"
      - "traefik.http.routers.prospector-ai-maintenance-us-http.service=prospector-ai-maintenance"
      - "traefik.http.routers.prospector-ai-maintenance-us-http.priority=500"

  # ── Backend: Next.js API-only ─────────────────────────────────────────────────
  backend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_MERCADOPAGO_PUBLIC_KEY=${NEXT_PUBLIC_MERCADOPAGO_PUBLIC_KEY}
        - NEXT_PUBLIC_APP_URL=${NEXT_PUBLIC_APP_URL}
        - MARKET=${MARKET:-BR}
    container_name: prospector-backend
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"
    env_file:
      - .env
    environment:
      - TZ=America/Sao_Paulo
      - SITE_URL_US=https://precisionai.innexar.app
      - SITE_URL_BR=https://precisionia.com.br
      - ADMIN_EMAILS=${ADMIN_EMAILS}
      - SUPPORT_EMAILS=${SUPPORT_EMAILS:-}
      - SEARCH_RATE_LIMIT_MAX=${SEARCH_RATE_LIMIT_MAX:-240}
      - SEARCH_RATE_LIMIT_AUTH_MAX=${SEARCH_RATE_LIMIT_AUTH_MAX:-6000}
      - SEARCH_RATE_LIMIT_ANON_MAX=${SEARCH_RATE_LIMIT_ANON_MAX:-120}
      - SEARCH_RATE_LIMIT_WINDOW_SECONDS=${SEARCH_RATE_LIMIT_WINDOW_SECONDS:-60}
      - SEARCH_BULKHEAD_MAX_IN_FLIGHT=${SEARCH_BULKHEAD_MAX_IN_FLIGHT:-25}
      - SEARCH_BULKHEAD_ACQUIRE_TIMEOUT_MS=${SEARCH_BULKHEAD_ACQUIRE_TIMEOUT_MS:-1500}
      - SEARCH_HISTORY_ASYNC=${SEARCH_HISTORY_ASYNC:-true}
      - SEARCH_USER_CONTEXT_CACHE_TTL_MS=${SEARCH_USER_CONTEXT_CACHE_TTL_MS:-5000}
      - SEARCH_DISTRIBUTED_LOCK_ENABLED=${SEARCH_DISTRIBUTED_LOCK_ENABLED:-true}
      - SEARCH_LOCK_TTL_MS=${SEARCH_LOCK_TTL_MS:-12000}
      - SEARCH_LOCK_WAIT_MS=${SEARCH_LOCK_WAIT_MS:-2500}
      - SEARCH_LOCK_POLL_MS=${SEARCH_LOCK_POLL_MS:-75}
      - SEARCH_HISTORY_QUEUE_CONCURRENCY=${SEARCH_HISTORY_QUEUE_CONCURRENCY:-3}
      - SEARCH_HISTORY_QUEUE_MAX_SIZE=${SEARCH_HISTORY_QUEUE_MAX_SIZE:-5000}
      - LEAD_SYNC_QUEUE_CONCURRENCY=${LEAD_SYNC_QUEUE_CONCURRENCY:-2}
      - LEAD_SYNC_QUEUE_MAX_SIZE=${LEAD_SYNC_QUEUE_MAX_SIZE:-1000}
      - AI_ALWAYS_INCLUDE_ENV_FALLBACK=${AI_ALWAYS_INCLUDE_ENV_FALLBACK:-true}
      - AI_FALLBACK_PROVIDER=GEMINI
    ports:
      - "127.0.0.1:3010:4000"
    depends_on:
      redis:
        condition: service_healthy
      db:
        condition: service_healthy
      pgbouncer:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512m
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:4000/api/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      - prospector-net

  # ── Redis ─────────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: prospector-redis
    command: redis-server /usr/local/etc/redis/redis.conf --requirepass "${REDIS_PASSWORD}"
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD}
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"
    volumes:
      - redis-data:/data
      - ./docker/redis.conf:/usr/local/etc/redis/redis.conf:ro
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 768m
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - prospector-net

  # ── PgBouncer: connection pooler para PostgreSQL ──────────────────────────────
  pgbouncer:
    image: bitnami/pgbouncer:latest
    container_name: prospector-pgbouncer
    environment:
      - POSTGRESQL_HOST=db
      - POSTGRESQL_PORT=5432
      - POSTGRESQL_USERNAME=${POSTGRES_USER}
      - POSTGRESQL_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRESQL_DATABASE=${POSTGRES_DB:-prospector_db}
      - PGBOUNCER_POOL_MODE=transaction
      - PGBOUNCER_DEFAULT_POOL_SIZE=25
      - PGBOUNCER_MAX_CLIENT_CONN=100
      - PGBOUNCER_IGNORE_STARTUP_PARAMETERS=extra_float_digits
    ports:
      - "127.0.0.1:6432:5432"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 128m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - prospector-net

  # ── PostgreSQL ────────────────────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    container_name: prospector-db
    shm_size: 2gb
    command:
      - "postgres"
      - "-c"
      - "shared_buffers=2GB"
      - "-c"
      - "effective_cache_size=6GB"
      - "-c"
      - "work_mem=32MB"
      - "-c"
      - "maintenance_work_mem=512MB"
      - "-c"
      - "random_page_cost=1.1"
      - "-c"
      - "effective_io_concurrency=200"
      - "-c"
      - "max_parallel_workers_per_gather=4"
      - "-c"
      - "max_parallel_workers=8"
      - "-c"
      - "max_worker_processes=8"
      - "-c"
      - "max_connections=200"
      - "-c"
      - "wal_buffers=32MB"
      - "-c"
      - "max_wal_size=2GB"
      - "-c"
      - "min_wal_size=512MB"
      - "-c"
      - "checkpoint_completion_target=0.9"
      - "-c"
      - "default_statistics_target=200"
      - "-c"
      - "temp_buffers=16MB"
      - "-c"
      - "huge_pages=try"
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-prospector_db}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5434:5432"
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 4g
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      prospector-net:
        aliases:
          - prospector-db

networks:
  prospector-net:
    driver: bridge
  fixelo-network:
    external: true
    name: fixelo_fixelo-network

volumes:
  redis-data:
  postgres-data:

# ── Redis Production Configuration ──────────────────────────────────────────
# Mounted into the container at /usr/local/etc/redis/redis.conf

# ── Authentication ──────────────────────────────────────────────────────────
# Password is passed via command-line --requirepass (see docker-compose.yml)

# ── Memory Management ──────────────────────────────────────────────────────
# 512MB limit — proportional for a 24GB shared host
maxmemory 512mb
maxmemory-policy allkeys-lru

# ── Persistence (RDB snapshots — already using redis-data volume) ─────────
save 3600 1
save 300 100
save 60 10000

# ── Security Hardening ─────────────────────────────────────────────────────
# Disable destructive commands in production
rename-command FLUSHALL ""
rename-command FLUSHDB ""
rename-command DEBUG ""

# ── Network ─────────────────────────────────────────────────────────────────
bind 0.0.0.0
protected-mode yes

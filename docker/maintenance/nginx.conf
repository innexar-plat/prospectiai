# Serve maintenance page with HTTP 503 for all requests.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    location / {
        # Return 503 and serve our custom page (nginx will send 503 status)
        error_page 503 /503.html;
        return 503;
    }
    location = /503.html {
        internal;
        add_header Cache-Control "no-store";
    }
}

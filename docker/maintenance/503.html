<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Em manutenção — ProspectorAI</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      background: #0f172a;
      color: #e2e8f0;
      text-align: center;
    }
    h1 {
      font-size: clamp(1.75rem, 5vw, 2.5rem);
      font-weight: 800;
      letter-spacing: -0.02em;
      opacity: 0.95;
      margin: 0 0 1rem;
    }
    p {
      margin: 0;
      color: #94a3b8;
      font-size: 1.125rem;
      max-width: 28rem;
    }
    p + p { margin-top: 0.5rem; }
    .small { font-size: 0.875rem; }
  </style>
</head>
<body>
  <h1>Em manutenção</h1>
  <p>Estamos melhorando a plataforma. Volte em breve.</p>
  <p class="small">Se a manutenção se estender, entre em contato pelo suporte.</p>
</body>
</html>

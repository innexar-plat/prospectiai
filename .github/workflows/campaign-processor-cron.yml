# Cron: processa campanhas de email agendadas (SCHEDULED → SENDING → SENT).
# Roda a cada 5 minutos via GitHub Actions.
#
# === Secrets necessários (mesmos do affiliate-approve-commissions-cron) ===
# CRON_SECRET — mesmo valor do .env do backend
# BACKEND_URL — URL base em produção (sem barra no final)
#
name: Campaign processor (cron)

on:
  schedule:
    # A cada 5 minutos
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Call campaign-processor
        env:
          BACKEND_URL: ${{ secrets.BACKEND_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$BACKEND_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "BACKEND_URL and CRON_SECRET must be set in repository secrets. Skipping."
            exit 0
          fi
          URL="${BACKEND_URL%/}/api/cron/campaign-processor"
          echo "Calling $URL ..."
          HTTP=$(curl -s -o /tmp/out -w "%{http_code}" \
            -X POST \
            -H "Authorization: Bearer $CRON_SECRET" \
            -H "Content-Type: application/json" \
            "$URL")
          cat /tmp/out
          echo ""
          echo "HTTP $HTTP"
          if [ "$HTTP" -ge 400 ]; then
            echo "::error::Campaign processor returned HTTP $HTTP"
            exit 1
          fi

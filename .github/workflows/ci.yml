name: CI

on:
  push:
    branches: [main, feat/*, fix/*, chore/*]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "20"
  SONAR_HOST_URL: "https://sonar.innexar.com.br"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
      - run: npm ci
      - run: npm run lint

  typecheck:
    name: TypeScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
      - run: npm ci
      - name: Prisma generate
        run: npm run postinstall -w backend
      - name: TypeCheck frontend
        run: npm run typecheck -w frontend
      - name: TypeCheck backend
        run: npx -w backend tsc --noEmit
      - name: TypeCheck admin
        working-directory: admin
        run: npx tsc --noEmit 2>/dev/null || true

  test-frontend:
    name: Test Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
      - run: npm ci
      - run: npm run test:coverage -w frontend
      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-frontend
          path: frontend/coverage/
          retention-days: 7

  test-backend:
    name: Test Backend
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: prospector
          POSTGRES_PASSWORD: prospector
          POSTGRES_DB: prospector_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
      - run: npm ci
      - name: Prisma generate
        run: npm run postinstall -w backend
      - name: Prisma migrate
        run: npx -w backend prisma migrate deploy
        env:
          DATABASE_URL: postgresql://prospector:prospector@localhost:5432/prospector_test
      - name: Run tests
        run: npm run test -w backend
        env:
          DATABASE_URL: postgresql://prospector:prospector@localhost:5432/prospector_test
          REDIS_URL: redis://localhost:6379
          AUTH_SECRET: test-secret-min-16-chars!!
          NODE_ENV: test
      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-backend
          path: backend/coverage/
          retention-days: 7

  test-admin:
    name: Test Admin
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
      - run: npm ci
      - run: npm run test --if-present -w admin

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint, typecheck]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
      - run: npm ci
      - name: Build frontend
        run: npm run build -w frontend
        env:
          VITE_MARKET: BR
      - name: Build backend
        run: npm run build -w backend
        env:
          AUTH_SECRET: build-secret-min-16-chars!!
          NEXTAUTH_URL: http://localhost:4000
          DATABASE_URL: postgresql://localhost:5432/prospector
          REDIS_URL: redis://localhost:6379
      - name: Build admin
        run: npm run build -w admin
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: |
            frontend/dist/
            backend/.next/
            admin/dist/
          retention-days: 3

  sonar:
    name: SonarQube
    runs-on: ubuntu-latest
    needs: [test-frontend, test-backend, test-admin]
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
      - run: npm ci
      - name: Download coverage artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: coverage-*
          path: ./
          merge-multiple: true
      - name: SonarQube Scan
        uses: sonarsource/sonarqube-scan-action@v4
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ env.SONAR_HOST_URL }}

  quality-gate:
    name: Quality Gate
    runs-on: ubuntu-latest
    needs: [lint, typecheck, test-frontend, test-backend, test-admin, build]
    if: always()
    steps:
      - run: |
          echo "## :: Résumé do CI :: ##"
          echo "Lint:        ${{ needs.lint.result }}"
          echo "TypeScript:  ${{ needs.typecheck.result }}"
          echo "Frontend:    ${{ needs.test-frontend.result }}"
          echo "Backend:     ${{ needs.test-backend.result }}"
          echo "Admin:       ${{ needs.test-admin.result }}"
          echo "Build:       ${{ needs.build.result }}"

          FAILED=false
          for job in lint typecheck test-frontend test-backend test-admin build; do
            result=$(eval "echo \${{ needs.$job.result }}")
            if [ "$result" != "success" ] && [ "$result" != "skipped" ]; then
              FAILED=true
              echo "❌ $job: $result"
            fi
          done

          if [ "$FAILED" = "true" ]; then
            echo "::warning::CI falhou — corrigir antes de mergear"
            exit 1
          else
            echo "✅ CI passou — pronto para merge"
          fi

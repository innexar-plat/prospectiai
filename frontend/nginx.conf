server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ── Security headers ────────────────────────────────────────────────────────
    include /etc/nginx/security-headers.conf;

    # Gzip
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript application/x-javascript image/svg+xml application/manifest+json;

    # Proxy all /api/* requests to the Next.js backend
    location /api/ {
        # Nome do container (evita colisão com alias "backend" na rede fixelo compartilhada)
        proxy_pass http://prospector-backend:4000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 120s;
    }

    # Admin SPA at /admin/
    location = /admin {
        return 301 $scheme://$host/admin/;
    }
    # SPA admin: usar root do server (evita loop com alias + try_files → /admin/index.html)
    location /admin/ {
        try_files $uri $uri/ /admin/index.html;
    }

    # Handle main React SPA — serve index.html for client routes; pre-rendered SEO HTML for indexable routes
    location / {
        try_files $uri $uri.html $uri/ /index.html;
    }

    # Never cache HTML entrypoints; avoids stale index referencing old hashed assets.
    location = /index.html {
        expires -1;
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-cache, must-revalidate";
    }

    location = /admin/index.html {
        expires -1;
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # Service worker must revalidate frequently to avoid stale offline behavior.
    location = /sw.js {
        expires -1;
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-cache";
    }

    # Version file must never be cached — used by the app to detect new deploys.
    location = /version.json {
        expires -1;
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # Admin version file — same no-cache policy.
    location = /admin/version.json {
        expires -1;
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # Cache Vite hashed assets aggressively (immutable)
    location ~* \.(js|css)$ {
        expires 1y;
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "public, immutable";
    }

    # Cache images and fonts with long lifetime
    location ~* \.(png|jpg|jpeg|gif|svg|webp|avif|woff|woff2|ttf|eot)$ {
        expires 6M;
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "public, max-age=15552000";
    }

    # PWA manifest with correct MIME type
    location = /manifest.json {
        types { application/manifest+json json; }
        add_header Cache-Control "public, max-age=86400";
    }

    # LLMs.txt — AI discoverability files served as text/markdown
    location ~ ^/llms(-full)?\.txt$ {
        default_type text/markdown;
        add_header Cache-Control "public, max-age=86400";
    }

    # Favicon and icons — moderate cache for quick brand updates
    location ~* \.(ico)$ {
        expires 7d;
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "public, max-age=604800";
    }
}
